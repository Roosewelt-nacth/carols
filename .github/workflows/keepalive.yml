# Free Supabase projects pause after a week with no traffic. This touches the database every few days so the
# carol app never goes to sleep before Christmas. Uses the same SUPABASE_URL and SUPABASE_ANON_KEY variables.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one row
        run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/seasons?select=year&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}"
